<!doctype html>
<!-- Sumber gambar share (og-image.jpg). Render ulang: node scripts/make-og.cjs -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:radial-gradient(60% 80% at 85% 20%,rgba(47,123,255,.45),transparent 70%),#070b14;color:#eef2f8;font-family:'Instrument Sans',sans-serif;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;padding:64px;align-items:center;overflow:hidden}
.l{display:grid;gap:28px}
.brand{display:flex;align-items:center;gap:16px;font:700 28px 'Bricolage Grotesque'}
.brand img{width:64px;height:64px;border-radius:14px;border:1px solid #2a3a56}
h1{font:700 62px/1.04 'Bricolage Grotesque';letter-spacing:-.02em}
p{font-size:24px;color:#c3ccdb}
.r{display:grid;grid-template-columns:1fr 1fr;gap:14px;transform:translateY(30px)}
.r img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;border:1px solid #2a3a56}
.r img:first-child{grid-row:1/3;height:100%}
</style></head><body>
<div class="l"><div class="brand"><img src="../public/images/brand/logo-256.png">Tradix Community</div>
<h1>Belajar trading crypto & forex bareng 350+ trader</h1><p>Gratis · Roadmap 8 minggu · Webinar & meetup</p></div>
<div class="r"><img src="../public/images/events/webinar-makro.webp"><img src="../public/images/events/meetup-bogor.webp"><img src="../public/images/events/trivtalks-bekasi.webp"></div>
</body></html>
